<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Collaborative Assessment Principles</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

.cam-interactive {
  --cam-section-blue: #5b9fee;
  --cam-aligned: #0869cf;
  --cam-actionable: #35afe9;
  --cam-sustainable: #5668f6;
  --cam-contextual: #11b9c8;
  --cam-center: #ffd34f;
  --cam-ink: #0f2437;
  --cam-white: #ffffff;
  --cam-focus: #111111;

  width: 100%;
  padding: clamp(38px, 5vw, 64px) clamp(22px, 5vw, 74px);
  background: var(--cam-section-blue);
  color: var(--cam-ink);
  box-sizing: border-box;
}

.cam-interactive *,
.cam-interactive *::before,
.cam-interactive *::after {
  box-sizing: border-box;
}

.cam-section-intro {
  width: min(100%, 1200px);
  margin: 0 auto clamp(24px, 3vw, 34px);
  color: var(--cam-ink);
  font-size: clamp(17px, 1.65vw, 21px);
  font-weight: 700;
  line-height: 1.4;
}

.cam-inner {
  width: min(100%, 1200px);
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(480px, 520px) minmax(0, 1fr);
  gap: clamp(52px, 5vw, 82px);
  align-items: center;
}

.cam-visual-column {
  display: flex;
  justify-content: center;
  width: 100%;
}

.cam-flower {
  position: relative;
  width: min(100%, 520px);
  aspect-ratio: 1 / 1;
}

.cam-petal,
.cam-center {
  font: inherit;
}

.cam-petal {
  position: absolute;
  width: 48.5%;
  height: 48.5%;
  border: 2px solid rgba(255, 255, 255, .62);
  padding: clamp(20px, 2.5vw, 31px);
  color: var(--cam-white);
  text-align: center;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 8px 18px rgba(8, 47, 84, .10),
    inset 0 0 0 1px rgba(255, 255, 255, .10);
  transition:
    transform 180ms ease,
    opacity 180ms ease,
    filter 180ms ease,
    border-color 180ms ease,
    box-shadow 180ms ease;
}


.cam-petal:hover,
.cam-petal:focus-visible,
.cam-petal.is-active {
  z-index: 3;
  transform: translateY(-5px) scale(1.035);
  border-color: var(--cam-focus);
  box-shadow:
    0 18px 32px rgba(8, 47, 84, .24),
    inset 0 0 0 1px rgba(255, 255, 255, .16);
  filter: saturate(1.08);
  outline: none;
}



.cam-flower[data-selected] .cam-petal:not(.is-active) {
  opacity: .58;
  filter: saturate(.78);
}

.cam-petal--aligned {
  top: 0;
  left: 0;
  border-radius: 0 58% 58% 58%;
  background: var(--cam-aligned);
}

.cam-petal--actionable {
  top: 0;
  right: 0;
  border-radius: 58% 0 58% 58%;
  background: var(--cam-actionable);
}

.cam-petal--sustainable {
  bottom: 0;
  left: 0;
  border-radius: 58% 58% 58% 0;
  background: var(--cam-sustainable);
}


.cam-petal--contextual {
  right: 0;
  bottom: 0;
  border-radius: 58% 58% 0 58%;
  background: var(--cam-contextual);
}


.cam-petal-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}




.cam-petal-title {
  margin-bottom: 11px;
  font-size: clamp(16px, 1.55vw, 18px);
  font-weight: 500;
  letter-spacing: .01em;
  text-transform: uppercase;
}

.cam-petal-copy {
  max-width: 18ch;
  font-size: clamp(12.5px, 1.3vw, 15px);
  line-height: 1.42;
}

.cam-center {
  position: absolute;
  z-index: 5;
  top: 50%;
  left: 50%;
  width: 34%;
  aspect-ratio: 1.35 / 1;
  transform: translate(-50%, -50%);
  border: 2px solid rgba(17, 56, 93, .25);
  border-radius: 50%;
  padding: 14px;
  background: var(--cam-center);
  color: #11385d;
  cursor: pointer;
  display: grid;
  place-items: center;
  text-align: center;
  font-weight: 600;
  line-height: 1.2;
  transition:
    transform 180ms ease,
    border-color 180ms ease,
    box-shadow 180ms ease;
}

.cam-center:hover,
.cam-center:focus-visible {
  transform: translate(-50%, -50%) scale(1.045);
  border-color: var(--cam-focus);
  box-shadow: 0 8px 18px rgba(8, 47, 84, .18);
  outline: none;
}

.cam-detail-column {
  width: 100%;
  min-width: 0;
  margin: 0;
}

.cam-details {
  display: grid;
  gap: 14px;
}

.cam-detail-item {
  border-left: 4px solid rgba(15, 36, 55, .18);
  padding: 10px 14px 10px 18px;
  opacity: .86;
  transition:
    border-color 180ms ease,
    opacity 180ms ease,
    transform 180ms ease,
    background 180ms ease,
    box-shadow 180ms ease;
}

.cam-detail-item.is-active {
  border-left-color: var(--cam-focus);
  opacity: 1;
  transform: translateX(5px);
  background: rgba(255, 255, 255, .22);
  box-shadow: 0 8px 22px rgba(8, 47, 84, .10);
}

.cam-detail-item.is-selected {
  box-shadow:
    0 8px 22px rgba(8, 47, 84, .13),
    inset 0 0 0 1px rgba(255, 255, 255, .10);
}

.cam-detail-item p {
  margin: 0;
  font-size: clamp(15px, 1.45vw, 18px);
  line-height: 1.58;
}

.cam-visually-hidden {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}


@media (max-width: 1050px) {
  .cam-section-intro,
  .cam-inner {
    width: min(100%, 820px);
  }

  .cam-inner {
    grid-template-columns: 1fr;
    gap: 38px;
  }

  .cam-detail-column {
    width: min(100%, 820px);
    margin: 0 auto;
  }
}

@media (max-width: 520px) {
  .cam-interactive {
    padding-inline: 14px;
  }

  .cam-petal {
    padding: 13px;
  }

  .cam-petal-title {
    margin-bottom: 7px;
    font-size: 14px;
  }



  .cam-petal-copy {
    font-size: 11px;
    line-height: 1.3;
  }

  .cam-center {
    width: 38%;
    padding: 9px;
    font-size: 11px;
  }

  .cam-detail-item {
    padding-inline: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .cam-petal,
  .cam-center,
  .cam-detail-item {
    transition: none;
  }
}

  </style>
</head>

<body>
  <div id="cam-preview">
    <script>
(function () {
  const script = document.currentScript;
  const host = script && script.parentElement ? script.parentElement : document.body;

  const principles = {
    aligned: {
      label: "Aligned",
      short:
        "Assessment activities reflect goals and outcomes of program activities",
      definition:
        "ALIGNED: This means that the assessment goals are well-articulated and all data collected tie back to these goals in specific ways without missing any key outcomes."
    },
    actionable: {
      label: "Actionable",
      short:
        "Data collection provides concrete next steps and long-term vision for the program",
      definition:
        "ACTIONABLE: This means that the data collected help explain the reasons behind why a program is functioning well or where it may need improvement."
    },
    sustainable: {
      label: "Sustainable",
      short:
        "Findings are translated into programmatic improvements and capacity for future assessment is included in planning",
      definition:
        "SUSTAINABLE: This means that the process of rerunning assessments, where needed, are planned for in advance to allow program leaders to carry on data collection."
    },
    contextual: {
      label: "Contextual",
      short:
        "Assessment approaches are accessible to and respectful of varied needs and values of the community",
      definition:
        "CONTEXT: This means considering the tone of a program, its relationship with participants, and the perspective of learners."
    }
  };

  host.innerHTML = `
    <section class="cam-interactive" aria-labelledby="cam-interactive-title">
      <h2 id="cam-interactive-title" class="cam-visually-hidden">
        Collaborative Assessment Principles
      </h2>

      <p class="cam-section-intro">
        Our work is guided by this model, which emphasizes assessments that are:
      </p>

      <div class="cam-inner">
        <div class="cam-visual-column">
          <div class="cam-flower" role="group" aria-label="Select a Collaborative Assessment principle">
            <button class="cam-petal cam-petal--aligned" type="button" data-principle="aligned" aria-pressed="false">
              <span class="cam-petal-content">
                <span class="cam-petal-title">${principles.aligned.label}</span>
                <span class="cam-petal-copy">${principles.aligned.short}</span>
              </span>
            </button>

            <button class="cam-petal cam-petal--actionable" type="button" data-principle="actionable" aria-pressed="false">
              <span class="cam-petal-content">
                <span class="cam-petal-title">${principles.actionable.label}</span>
                <span class="cam-petal-copy">${principles.actionable.short}</span>
              </span>
            </button>

            <button class="cam-petal cam-petal--sustainable" type="button" data-principle="sustainable" aria-pressed="false">
              <span class="cam-petal-content">
                <span class="cam-petal-title">${principles.sustainable.label}</span>
                <span class="cam-petal-copy">${principles.sustainable.short}</span>
              </span>
            </button>

            <button class="cam-petal cam-petal--contextual" type="button" data-principle="contextual" aria-pressed="false">
              <span class="cam-petal-content">
                <span class="cam-petal-title">${principles.contextual.label}</span>
                <span class="cam-petal-copy">${principles.contextual.short}</span>
              </span>
            </button>

            <button class="cam-center" type="button" data-action="reset" aria-label="Clear the selected principle">
              <span>Collaborative<br>Assessment<br>Principles</span>
            </button>
          </div>
        </div>

        <div class="cam-detail-column" aria-live="polite">
          <div class="cam-details">
            ${Object.entries(principles)
              .map(
                ([id, item]) => `
                  <article class="cam-detail-item" data-detail="${id}">
                    <p>${item.definition}</p>
                  </article>
                `
              )
              .join("")}
          </div>
        </div>
      </div>
    </section>
  `;

  const flower = host.querySelector(".cam-flower");
  const petalButtons = Array.from(host.querySelectorAll(".cam-petal"));
  const detailItems = Array.from(host.querySelectorAll(".cam-detail-item"));
  const resetButton = host.querySelector('[data-action="reset"]');

  let lockedId = null;

  function paint(id) {
    if (id) {
      flower.dataset.selected = id;
    } else {
      delete flower.dataset.selected;
    }

    petalButtons.forEach((button) => {
      const active = button.dataset.principle === id;
      button.classList.toggle("is-active", active);
      button.classList.toggle("is-selected", lockedId === button.dataset.principle);
      button.setAttribute(
        "aria-pressed",
        lockedId === button.dataset.principle ? "true" : "false"
      );
    });

    detailItems.forEach((item) => {
      item.classList.toggle("is-active", item.dataset.detail === id);
      item.classList.toggle("is-selected", item.dataset.detail === lockedId);
    });
  }

  function previewPrinciple(id) {
    paint(id);
  }

  function restoreLockedState() {
    paint(lockedId);
  }

  function togglePrinciple(id) {
    lockedId = lockedId === id ? null : id;
    paint(lockedId);
  }

  function resetView() {
    lockedId = null;
    paint(null);
  }

  petalButtons.forEach((button) => {
    const id = button.dataset.principle;

    button.addEventListener("mouseenter", () => previewPrinciple(id));
    button.addEventListener("mouseleave", restoreLockedState);
    button.addEventListener("focus", () => previewPrinciple(id));
    button.addEventListener("blur", restoreLockedState);
    button.addEventListener("click", () => togglePrinciple(id));
  });

  resetButton.addEventListener("click", resetView);

  resetView();
})();

    </script>
  </div>
</body>
</html>
